<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vatsap Pro Video Fix</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: #e5ddd5; overflow: hidden; }
        #app { max-width: 500px; margin: auto; height: 100vh; display: flex; flex-direction: column; background: #fff; position: relative; }
        header { background: #075e54; color: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        #msg-area { flex: 1; overflow-y: auto; padding: 15px; background: #efe7dd; display: flex; flex-direction: column; gap: 10px; padding-bottom: 70px; }
        .msg { padding: 10px; border-radius: 8px; max-width: 80%; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: #dcf8c6; }
        .received { align-self: flex-start; background: #fff; }
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #f6f6f6; display: flex; border-top: 1px solid #ddd; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #51585c; font-size: 12px; }
        .nav-item.active { color: #075e54; border-top: 3px solid #075e54; }
        .screen { display: none; flex-direction: column; height: calc(100% - 120px); }
        .active-screen { display: flex; }
        #call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 94, 84, 0.95); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .call-btn { padding: 15px 30px; border-radius: 30px; border: none; color: white; font-weight: bold; margin: 10px; cursor: pointer; }
        .input-bar { padding: 10px; background: #f0f0f0; display: flex; gap: 8px; align-items: center; position: absolute; bottom: 60px; width: 100%; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; }
        #video-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 30%; height: 20%; position: absolute; top: 20px; right: 20px; border: 2px solid #fff; border-radius: 10px; object-fit: cover; }
    </style>
</head>
<body>

<div id="app">
    <div id="auth-screen" style="padding: 150px 20px; text-align: center;">
        <h2>Vatsap Pro</h2>
        <button onclick="login()" style="background:#128c7e; color:white; padding:15px 40px; border:none; border-radius:25px;">Giriş</button>
    </div>

    <div id="main-content" style="display:none; height: 100%;">
        <header>
            <div id="h-name">Vatsap</div>
            <div style="display:flex; gap:20px; font-size: 20px;">
                <span onclick="startCall()" style="cursor:pointer">🎥</span>
            </div>
        </header>

        <div id="chat-screen" class="screen active-screen">
            <div id="msg-area"></div>
            <div class="input-bar">
                <label for="file-input" style="cursor:pointer; font-size:24px;">📎</label>
                <input type="file" id="file-input" style="display:none" onchange="sendFile()">
                <input type="text" id="m-input" placeholder="Mesaj yazın...">
                <span onclick="sendMsg()" style="color:#075e54; cursor:pointer; font-size:24px;">➤</span>
            </div>
        </div>

        <div id="friends-screen" class="screen" style="padding: 20px;">
            <h3>Dost Əlavə Et</h3>
            <input type="text" id="f-code" placeholder="Dost kodu..." style="width:100%; padding:12px; margin-bottom:10px;">
            <button onclick="connect()" style="width:100%; background:#075e54; color:white; padding:12px; border:none; border-radius:5px;">Bağlan</button>
            <p style="margin-top:20px;">Sizin kodunuz: <b id="my-id-display"></b></p>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="showScreen('chat', this)">💬<br>Mesajlar</div>
            <div class="nav-item" onclick="showScreen('friends', this)">👥<br>Dostlar</div>
        </div>
    </div>

    <div id="call-overlay">
        <h2 id="caller-name">Zəng gəlir...</h2>
        <div style="display:flex;">
            <button class="call-btn" style="background:#4cd964;" onclick="acceptCall()">Qəbul Et</button>
            <button class="call-btn" style="background:#ff3b30;" onclick="location.reload()">Rədd Et</button>
        </div>
    </div>

    <div id="video-ui">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <button onclick="location.reload()" style="position:absolute; bottom:50px; left:50%; transform:translateX(-50%); background:red; color:white; border:none; padding:15px 40px; border-radius:30px;">Bitir</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, get, remove, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const fb = initializeApp({
        apiKey: "AIzaSyCgzvEi_a1v0SjdltQwHpN4rmyNk_1CivE",
        authDomain: "vatsap-8e132.firebaseapp.com",
        databaseURL: "https://vatsap-8e132-default-rtdb.firebaseio.com",
        projectId: "vatsap-8e132",
        appId: "1:468284893218:web:dd0494a3ea9877d110827b"
    });

    const auth = getAuth(fb);
    const db = getDatabase(fb);
    const provider = new GoogleAuthProvider();

    let user, myCode, targetCode, pc, localStream, incomingData;
    let startTime = Date.now();

    window.login = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, async (u) => {
        if (u) {
            user = u; myCode = user.uid.substring(0, 6);
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('my-id-display').innerText = myCode;
            await set(ref(db, 'users/' + myCode), { n: user.displayName });

            onValue(ref(db, `calls/${myCode}/offer`), (snap) => {
                const data = snap.val();
                if (data && data.t > startTime && !pc) {
                    incomingData = data;
                    document.getElementById('caller-name').innerText = data.n + " zəng edir...";
                    document.getElementById('call-overlay').style.display = 'flex';
                }
            });
        }
    });

    window.showScreen = (n, el) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(n + '-screen').classList.add('active-screen');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    };

    window.connect = async () => {
        targetCode = document.getElementById('f-code').value.trim();
        if(!targetCode) return;
        chatId = [myCode, targetCode].sort().join("_");
        onValue(ref(db, 'chats/' + chatId), (s) => {
            const area = document.getElementById('msg-area'); area.innerHTML = "";
            s.forEach(c => {
                const d = c.val();
                if(d.type === 'file') {
                    area.innerHTML += `<div class="msg ${d.s === user.uid ? 'sent' : 'received'}"><b>${d.n}:</b><br>📂 Fayl: <a href="${d.fileData}" download="${d.m}" style="color:blue">Yüklə: ${d.m}</a></div>`;
                } else {
                    area.innerHTML += `<div class="msg ${d.s === user.uid ? 'sent' : 'received'}"><b>${d.n}:</b><br>${d.m}</div>`;
                }
            });
            area.scrollTop = area.scrollHeight;
        });
        alert("Bağlanıldı!");
        showScreen('chat', document.querySelector('.nav-item'));
    };

    window.sendMsg = () => {
        const m = document.getElementById('m-input').value.trim();
        if(m && chatId) push(ref(db, 'chats/' + chatId), { s: user.uid, n: user.displayName, m, type: 'text' });
        document.getElementById('m-input').value = "";
    };

    window.sendFile = () => {
        const file = document.getElementById('file-input').files[0];
        if(!file || !chatId) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            push(ref(db, 'chats/' + chatId), { s: user.uid, n: user.displayName, m: file.name, type: 'file', fileData: e.target.result });
        };
        reader.readAsDataURL(file);
    };

    // --- WEBRTC FIX ---
    async function setupRTC(remoteCode) {
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] });
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        
        pc.ontrack = (e) => {
            if (e.streams[0]) document.getElementById('remoteVideo').srcObject = e.streams[0];
        };

        pc.onicecandidate = (e) => {
            if (e.candidate) push(ref(db, `calls/${remoteCode}/ice`), e.candidate.toJSON());
        };

        onChildAdded(ref(db, `calls/${myCode}/ice`), (s) => {
            if (s.exists()) pc.addIceCandidate(new RTCIceCandidate(s.val()));
        });

        document.getElementById('video-ui').style.display = 'block';
    }

    window.startCall = async () => {
        if(!targetCode) targetCode = document.getElementById('f-code').value.trim();
        if(!targetCode) return alert("Əvvəlcə dost kodunu yazın və Bağlan düyməsinə basın!");
        await setupRTC(targetCode);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await set(ref(db, `calls/${targetCode}/offer`), { sdp: offer.sdp, type: offer.type, n: user.displayName, t: Date.now(), from: myCode });
        
        onValue(ref(db, `calls/${myCode}/answer`), (s) => {
            if (s.exists() && pc.signalingState !== "stable") pc.setRemoteDescription(new RTCSessionDescription(s.val()));
        });
    };

    window.acceptCall = async () => {
        document.getElementById('call-overlay').style.display = 'none';
        await setupRTC(incomingData.from);
        await pc.setRemoteDescription(new RTCSessionDescription(incomingData));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await set(ref(db, `calls/${incomingData.from}/answer`), { sdp: answer.sdp, type: answer.type });
    };
</script>
</body>
</html>
