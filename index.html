<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vatsap G14 Pro</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: #e5ddd5; overflow: hidden; }
        #app { max-width: 500px; margin: auto; height: 100vh; display: flex; flex-direction: column; background: #fff; position: relative; }
        header { background: #075e54; color: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        #msg-area { flex: 1; overflow-y: auto; padding: 15px; background: #efe7dd; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 8px; max-width: 80%; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: #dcf8c6; }
        .received { align-self: flex-start; background: #fff; }
        #video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 999; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 30%; height: 20%; position: absolute; top: 20px; right: 20px; border: 2px solid #fff; z-index: 1000; border-radius: 10px; }
        .controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; z-index: 1001; }
        .hang { background: #ff3b30; color: white; border: none; padding: 15px 35px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .input-bar { padding: 10px; background: #f0f0f0; display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none; }
    </style>
</head>
<body>

<div id="app">
    <div id="auth-screen" style="padding: 150px 20px; text-align: center;">
        <button onclick="login()" style="background:#128c7e; color:white; padding:15px 40px; border:none; border-radius:25px; font-size:18px;">Giriş Et</button>
    </div>

    <div id="chat-screen" style="display:none; flex-direction: column; height: 100%;">
        <header>
            <div id="h-name">Yüklənir...</div>
            <div onclick="startCall()" style="cursor:pointer; font-size: 20px;">🎥</div>
        </header>
        <div style="padding:8px; background:#f0f0f0; display:flex; gap:5px; border-bottom:1px solid #ddd;">
            <input type="text" id="f-code" placeholder="Dost kodu">
            <button onclick="connect()" style="background:#075e54; color:white; border:none; padding:5px 15px; border-radius:5px;">Bağlan</button>
        </div>
        <div id="msg-area"></div>
        <div class="input-bar">
            <span onclick="askAI()" style="cursor:pointer; font-size:24px;">🤖</span>
            <input type="text" id="m-input" placeholder="Mesaj...">
            <span onclick="sendMsg()" style="color:#075e54; cursor:pointer; font-size:24px;">➤</span>
        </div>
    </div>

    <div id="video-container">
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="controls"><button class="hang" onclick="location.reload()">Bitir</button></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, get, remove, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const config = {
        apiKey: "AIzaSyCgzvEi_a1v0SjdltQwHpN4rmyNk_1CivE",
        authDomain: "vatsap-8e132.firebaseapp.com",
        databaseURL: "https://vatsap-8e132-default-rtdb.firebaseio.com",
        projectId: "vatsap-8e132",
        appId: "1:468284893218:web:dd0494a3ea9877d110827b"
    };

    const app = initializeApp(config);
    const auth = getAuth();
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let user, myCode, chatId, pc, localStream;
    let startTime = Date.now();

    window.login = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, async (u) => {
        if (u) {
            user = u;
            myCode = user.uid.substring(0, 6);
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('h-name').innerText = user.displayName + " (" + myCode + ")";
            await set(ref(db, 'users/' + myCode), { n: user.displayName });

            onValue(ref(db, `calls/${myCode}/offer`), async (snap) => {
                const data = snap.val();
                if (data && data.t > startTime && !pc) {
                    if (confirm(data.n + " zəng edir. Qəbul edilsin?")) await answerCall(data);
                }
            });
        }
    });

    window.connect = async () => {
        const code = document.getElementById('f-code').value.trim();
        const res = await get(ref(db, 'users/' + code));
        if (res.exists()) {
            chatId = [myCode, code].sort().join("_");
            onValue(ref(db, 'chats/' + chatId), (s) => {
                const area = document.getElementById('msg-area');
                area.innerHTML = "";
                s.forEach(c => {
                    const d = c.val();
                    // UNDEFINED TƏMİZLƏYİCİ
                    if(d && d.m && d.n && d.m !== "undefined") {
                        area.innerHTML += `<div class="msg ${d.s === user.uid ? 'sent' : 'received'}"><b>${d.n}:</b><br>${d.m}</div>`;
                    }
                });
                area.scrollTop = area.scrollHeight;
            });
        }
    };

    window.sendMsg = (customMsg = null, sId = null, sName = null) => {
        const m = customMsg || document.getElementById('m-input').value.trim();
        if(!m || !chatId) return;
        push(ref(db, 'chats/' + chatId), { s: sId || user.uid, n: sName || user.displayName, m: m });
        if(!customMsg) document.getElementById('m-input').value = "";
    };

    window.askAI = async () => {
        const p = document.getElementById('m-input').value.trim();
        if(!p) return;
        const key = "AIzaSyAwZfDJ1GNbM108PHH9bhtRRgJ6u8PzieY";
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ contents: [{ parts: [{ text: p }] }] })
            });
            const d = await r.json();
            window.sendMsg(d.candidates[0].content.parts[0].text, 'ai', 'Kor AI');
        } catch (e) { alert("Kor AI hazırda cavab verə bilmir."); }
    };

    async function initRTC() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.ontrack = (e) => document.getElementById('remoteVideo').srcObject = e.streams[0];
            document.getElementById('video-container').style.display = 'flex';
            return true;
        } catch (e) { 
            alert("Moto G14 Diqqət: Brauzer ayarlarına girib Kamera və Mikrofon icazəsini 'Həmişə icazə ver' edin."); 
            return false; 
        }
    }

    window.startCall = async () => {
        const fCode = document.getElementById('f-code').value.trim();
        if(!fCode) return alert("Əvvəlcə dost kodu yazın!");
        if(await initRTC()) {
            pc.onicecandidate = (e) => { if(e.candidate) push(ref(db, `calls/${fCode}/ice`), e.candidate.toJSON()); };
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await set(ref(db, `calls/${fCode}/offer`), { sdp: offer.sdp, type: offer.type, n: user.displayName, t: Date.now() });
            onValue(ref(db, `calls/${myCode}/answer`), async (snap) => {
                if(snap.exists() && pc.signalingState !== "stable") await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
            });
            onChildAdded(ref(db, `calls/${myCode}/ice`), (snap) => { if(snap.exists()) pc.addIceCandidate(new RTCIceCandidate(snap.val())); });
        }
    };

    async function answerCall(offer) {
        if(await initRTC()) {
            const fCode = document.getElementById('f-code').value.trim();
            pc.onicecandidate = (e) => { if(e.candidate) push(ref(db, `calls/${fCode}/ice`), e.candidate.toJSON()); };
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            await set(ref(db, `calls/${fCode}/answer`), { sdp: answer.sdp, type: answer.type });
            onChildAdded(ref(db, `calls/${myCode}/ice`), (snap) => { if(snap.exists()) pc.addIceCandidate(new RTCIceCandidate(snap.val())); });
        }
    }
</script>
</body>
  </html>
