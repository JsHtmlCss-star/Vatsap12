<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vatsap Pro Ultra Pro-Fix</title>
    <style>
        :root { --main: #075e54; --light: #dcf8c6; --bg: #e5ddd5; --text: #000; --header: #075e54; }
        .dark { --main: #232d36; --light: #054740; --bg: #101d25; --text: #fff; --header: #232d36; }
        
        * { box-sizing: border-box; transition: background 0.3s; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        #app { max-width: 500px; margin: auto; height: 100vh; display: flex; flex-direction: column; background: var(--bg); position: relative; }
        
        header { background: var(--header); color: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .status-info { font-size: 11px; opacity: 0.8; }

        #msg-area { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-bottom: 80px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 14px; position: relative; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: var(--light); color: #000; }
        .received { align-self: flex-start; background: white; color: #000; }
        .dark .received { background: #262d31; color: white; }

        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #f6f6f6; display: flex; border-top: 1px solid #ddd; z-index: 5; }
        .dark .bottom-nav { background: #054740; border-top: 1px solid #232d36; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; }

        .input-bar { position: absolute; bottom: 60px; width: 100%; padding: 10px; background: #f0f0f0; display: flex; gap: 8px; align-items: center; }
        .dark .input-bar { background: #1e2428; border-top: 1px solid #333; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
        .dark input[type="text"] { background: #2a2f32; color: white; }

        #video-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; flex-direction: column; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 30%; height: 20%; position: absolute; top: 20px; right: 20px; border: 1px solid #fff; border-radius: 8px; }
        #voice-call-ui { display: none; width: 100%; height: 100%; background: #075e54; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="app">
    <div id="auth-screen" style="padding: 100px 20px; text-align: center;">
        <h1 style="color: #075e54;">Vatsap Ultra</h1>
        <button onclick="login()" style="padding:15px 40px; border-radius:25px; border:none; background: #128c7e; color:white; font-size: 18px; cursor: pointer;">Google ilə Giriş</button>
    </div>

    <div id="main-content" style="display:none; height:100%;">
        <header>
            <div>
                <b id="h-name">Vatsap</b><br>
                <span id="h-status" class="status-info"></span>
            </div>
            <div style="display:flex; gap:15px; font-size: 20px;">
                <span onclick="toggleTheme()" style="cursor:pointer">🌓</span>
                <span id="call-icons" style="display:none; gap:15px;">
                    <span onclick="makeCall('voice')" style="cursor:pointer">📞</span>
                    <span onclick="makeCall('video')" style="cursor:pointer">🎥</span>
                </span>
            </div>
        </header>

        <div id="chat-screen" class="screen active-screen" style="display:flex; height:calc(100% - 120px); flex-direction: column;">
            <div id="msg-area"></div>
            <div class="input-bar">
                <label for="file-input" style="cursor:pointer; font-size: 22px;">📎</label>
                <input type="file" id="file-input" style="display:none" onchange="sendFile()">
                <input type="text" id="m-input" placeholder="Mesaj..." oninput="sendTyping()">
                <span id="voice-btn" 
                      onmousedown="startVoice()" onmouseup="stopVoice()" 
                      ontouchstart="startVoice()" ontouchend="stopVoice()" 
                      style="font-size:22px; cursor:pointer; user-select: none;">🎤</span>
                <span onclick="sendMsg()" style="font-size:22px; cursor:pointer; color: #075e54;">➤</span>
            </div>
        </div>

        <div id="friends-screen" class="screen" style="display:none; padding:20px;">
            <h3>Dostun Kodu</h3>
            <input type="text" id="f-code" placeholder="6 rəqəmli kod" style="width:100%; padding:12px; border-radius: 8px; border:1px solid #ddd;">
            <button onclick="connect()" style="width:100%; margin-top:10px; background:#075e54; color:white; padding:12px; border:none; border-radius: 8px;">Bağlan</button>
            <p style="text-align:center; margin-top:20px;">Kodun: <b id="my-id-display" style="font-size: 20px; color:#075e54;"></b></p>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="showScreen('chat')">💬<br>Mesaj</div>
            <div class="nav-item" onclick="showScreen('friends')">👥<br>Dostlar</div>
        </div>
    </div>

    <div id="video-ui">
        <div id="voice-call-ui">
            <div style="font-size: 100px; margin-bottom: 20px;">👤</div>
            <h2 id="v-call-name">Zəng edilir...</h2>
            <p>Danışılır</p>
        </div>
        <video id="remoteVideo" autoplay playsinline></video>
        <audio id="remoteAudio" autoplay playsinline></audio>
        <video id="localVideo" autoplay playsinline muted></video>
        <button onclick="endCall()" style="position:absolute; bottom:50px; left:50%; transform:translateX(-50%); background:red; color:white; padding:15px 45px; border-radius:30px; border:none; font-weight: bold; cursor: pointer;">Bitir</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, get, onChildAdded, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const fb = initializeApp({
        apiKey: "AIzaSyCgzvEi_a1v0SjdltQwHpN4rmyNk_1CivE",
        authDomain: "vatsap-8e132.firebaseapp.com",
        databaseURL: "https://vatsap-8e132-default-rtdb.firebaseio.com",
        projectId: "vatsap-8e132",
        appId: "1:468284893218:web:dd0494a3ea9877d110827b"
    });

    const auth = getAuth(fb), db = getDatabase(fb), provider = new GoogleAuthProvider();
    let user, myCode, targetCode, pc, localStream, mediaRecorder, chunks = [];
    let sessionStartTime = Date.now(); 

    window.login = () => signInWithPopup(auth, provider);
    window.toggleTheme = () => document.body.classList.toggle('dark');

    onAuthStateChanged(auth, async (u) => {
        if (u) {
            user = u; myCode = user.uid.substring(0, 6);
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('my-id-display').innerText = myCode;
            set(ref(db, `users/${myCode}`), { n: user.displayName, s: 'online' });
            
            onValue(ref(db, `calls/${myCode}/offer`), (s) => {
                if (s.exists()) {
                    const d = s.val();
                    if (d.t > sessionStartTime && !pc) {
                        if (confirm(d.n + " zəng edir...")) acceptCall(d);
                        else remove(ref(db, `calls/${myCode}`));
                    }
                }
            });
        }
    });

    window.showScreen = (n) => {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(n + '-screen').style.display = 'flex';
    };

    window.sendTyping = () => {
        if(targetCode) {
            set(ref(db, `typing/${targetCode}/${myCode}`), true);
            setTimeout(() => set(ref(db, `typing/${targetCode}/${myCode}`), null), 2000);
        }
    };

    window.connect = async () => {
        targetCode = document.getElementById('f-code').value.trim();
        const res = await get(ref(db, `users/${targetCode}`));
        if(!res.exists()) return alert("Dost tapılmadı!");
        document.getElementById('h-name').innerText = res.val().n;
        document.getElementById('call-icons').style.display = 'flex';
        
        onValue(ref(db, `typing/${myCode}/${targetCode}`), (s) => {
            document.getElementById('h-status').innerText = s.exists() ? "Yazır..." : "Online";
        });

        const chatId = [myCode, targetCode].sort().join("_");
        onValue(ref(db, `chats/${chatId}`), (s) => {
            const area = document.getElementById('msg-area'); area.innerHTML = "";
            s.forEach(c => {
                const d = c.val();
                let m = d.m;
                if(d.type === 'file') m = `📂 <a href="${d.fileData}" download="${d.m}" style="color:blue;">${d.m}</a>`;
                if(d.type === 'voice') m = `<audio controls src="${d.fileData}" style="width:200px;"></audio>`;
                area.innerHTML += `<div class="msg ${d.s === user.uid ? 'sent' : 'received'}" onclick="deleteMsg('${c.key}')"><b>${d.n}:</b><br>${m}</div>`;
            });
            area.scrollTop = area.scrollHeight;
        });
        showScreen('chat');
    };

    window.deleteMsg = (key) => {
        if(confirm("Silinsin?")) remove(ref(db, `chats/${[myCode, targetCode].sort().join("_")}/${key}`));
    };

    window.sendMsg = () => {
        const m = document.getElementById('m-input').value.trim();
        if(m && targetCode) push(ref(db, `chats/${[myCode, targetCode].sort().join("_")}`), { s: user.uid, n: user.displayName, m, type: 'text' });
        document.getElementById('m-input').value = "";
    };

    // --- SƏS YAZMA FİX VERSİYA ---
    window.startVoice = async () => {
        try {
            chunks = [];
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // Format yoxlanışı
            const options = { mimeType: 'audio/webm;codecs=opus' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) options.mimeType = 'audio/mp4';

            mediaRecorder = new MediaRecorder(stream, options);
            
            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                if (chunks.length > 0) {
                    const blob = new Blob(chunks, { type: mediaRecorder.mimeType });
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        if(targetCode && e.target.result.length > 200) {
                            push(ref(db, `chats/${[myCode, targetCode].sort().join("_")}`), { 
                                s: user.uid, n: user.displayName, m: 'Səsli mesaj', type: 'voice', fileData: e.target.result 
                            });
                        }
                    };
                    reader.readAsDataURL(blob);
                }
                stream.getTracks().forEach(t => t.stop());
            };

            // 1000ms timeslice səs kəsilməsinin qarşısını alır
            mediaRecorder.start(1000); 
            document.getElementById('voice-btn').style.color = "red";
            document.getElementById('voice-btn').style.transform = "scale(1.3)";
        } catch (err) { alert("Mikrafon xətası!"); }
    };

    window.stopVoice = () => {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
            document.getElementById('voice-btn').style.color = "";
            document.getElementById('voice-btn').style.transform = "scale(1)";
        }
    };

    window.sendFile = () => {
        const file = document.getElementById('file-input').files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => push(ref(db, `chats/${[myCode, targetCode].sort().join("_")}`), { s: user.uid, n: user.displayName, m: file.name, type: 'file', fileData: e.target.result });
        reader.readAsDataURL(file);
    };

    // --- WebRTC ---
    async function setupRTC(mode, remote) {
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' });
        document.getElementById('video-ui').style.display = 'flex';
        if(mode === 'video') {
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('voice-call-ui').style.display = 'none';
        } else {
            document.getElementById('voice-call-ui').style.display = 'flex';
            document.getElementById('localVideo').style.display = 'none';
            document.getElementById('remoteVideo').style.display = 'none';
        }
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        pc.ontrack = (e) => {
            const el = mode === 'video' ? document.getElementById('remoteVideo') : document.getElementById('remoteAudio');
            el.srcObject = e.streams[0];
        };
        pc.onicecandidate = (e) => e.candidate && push(ref(db, `calls/${remote}/ice`), e.candidate.toJSON());
        onChildAdded(ref(db, `calls/${myCode}/ice`), (s) => s.exists() && pc.addIceCandidate(new RTCIceCandidate(s.val())));
    }

    window.makeCall = async (mode) => {
        await setupRTC(mode, targetCode);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        set(ref(db, `calls/${targetCode}/offer`), { sdp: offer.sdp, type: offer.type, n: user.displayName, from: myCode, mode, t: Date.now() });
        onValue(ref(db, `calls/${myCode}/answer`), (s) => {
            if(s.exists() && pc.signalingState !== "stable") pc.setRemoteDescription(new RTCSessionDescription(s.val()));
        });
    };

    async function acceptCall(data) {
        await setupRTC(data.mode, data.from);
        await pc.setRemoteDescription(new RTCSessionDescription(data));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        set(ref(db, `calls/${data.from}/answer`), { sdp: answer.sdp, type: answer.type });
    }

    window.endCall = () => {
        if(targetCode) remove(ref(db, `calls/${targetCode}`));
        remove(ref(db, `calls/${myCode}`));
        location.reload();
    };
</script>
</body>
</html>
